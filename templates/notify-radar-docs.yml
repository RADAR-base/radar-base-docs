# Copy this file to .github/workflows/notify-radar-docs.yml in YOUR repository.
#
# It tells the RADAR-base documentation site to rebuild whenever you publish a release
# or change your docs on the default branch, so your documentation appears on
# https://radar-base.github.io/radar-base-docs/ within a couple of minutes instead of
# waiting for that site's nightly rebuild.
#
# Requires one secret in this repository (or, better, an organisation-level secret
# shared by all RADAR-base repositories):
#
#   RADAR_DOCS_DISPATCH_TOKEN — a fine-grained personal access token, or a GitHub App
#   installation token, with "Contents: read and write" on RADAR-base/radar-base-docs.
#   That is the permission GitHub requires to send a repository_dispatch event.
#
# This workflow is optional. Without it your documentation is still published; it just
# arrives on the site's next scheduled build rather than immediately.

name: Notify RADAR-base docs

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask radar-base-docs to rebuild
        env:
          TOKEN: ${{ secrets.RADAR_DOCS_DISPATCH_TOKEN }}
        # Skip silently on forks and wherever the secret is not configured, so this
        # workflow never fails a contributor's build.
        if: ${{ github.repository_owner == 'RADAR-base' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RADAR_DOCS_DISPATCH_TOKEN is not set — skipping docs rebuild request."
            exit 0
          fi

          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RADAR-base/radar-base-docs/dispatches \
            -d '{
                  "event_type": "docs-update",
                  "client_payload": {
                    "repository": "${{ github.repository }}",
                    "ref": "${{ github.ref_name }}",
                    "event": "${{ github.event_name }}"
                  }
                }'

          echo "Requested a documentation rebuild for ${{ github.repository }}."
