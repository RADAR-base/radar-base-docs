      - Quickstart.md
      - Configuration.md
      - Core Concepts.md
  - label: Guides
    items:
      - Create your first pipeline.md
      - Radarpipeline as a CLI tool.md
      - Radarpipeline & jupyter notebooks.md
      - Radarpipeline for Big data.md
      - RADAR-pipeline reformating the data.md
  - Future plans.md
