# Stand-in manifest for RADAR-base/radarpipeline.
#
# Delete this file once the repository ships its own docs/radar-docs.yml; anything it
# defines there already takes precedence over this. See ../README.md.

homepage: Introduction.md

# The repository's README carries the installation instructions, which the docs folder
# does not repeat, so it is published as a page of its own.
extraDocs:
